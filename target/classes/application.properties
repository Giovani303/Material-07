# ===================================================
# CONFIGURAÇÃO GERAL DA APLICAÇÃO
# ===================================================
spring.application.name=springBootList

# ===================================================
# CONFIGURAÇÃO DA FONTE DE DADOS (DATASOURCE - MYSQL)
# Valores padrão para execução local; na nuvem são sobrescritos
# pelas variáveis de ambiente SPRING_DATASOURCE_*
# ===================================================
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/sales?createDatabaseIfNotExist=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:legends2525!}

# ===================================================
# CONFIGURAÇÃO DO JPA / HIBERNATE
# ===================================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.hibernate.use-new-id-generator-mappings=false

# ===================================================
# CONFIGURAÇÃO DO THYMELEAF
# ===================================================
spring.thymeleaf.cache=false
